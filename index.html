<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e10600">
<title>VNO Reformas Multiservicios</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
.app{max-width:480px;min-height:100vh;margin:auto;background:#111}
header{padding:22px;text-align:center;border-bottom:1px solid #292929}
.logo{font-size:44px;font-weight:900;letter-spacing:-3px}.logo span{color:#e10600}
.sub{font-size:12px;letter-spacing:2px;color:#ccc}
.screen{padding:24px 20px}.back{color:#fff;background:none;border:0;font-size:15px;padding:0;margin-bottom:18px}
h1{font-size:27px;margin:0 0 8px}.intro{color:#aaa;margin:0 0 22px}
label{display:block;font-weight:700;margin:17px 0 8px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{background:#1d1d1d;border:1px solid #333;color:#fff;border-radius:12px;padding:14px;text-align:left}
.option.selected{border:2px solid #e10600;background:#241010}
input,textarea{width:100%;background:#1d1d1d;border:1px solid #444;border-radius:11px;padding:14px;color:#fff;font-size:16px}
textarea{min-height:100px;resize:vertical}
.photo{border:2px dashed #555;border-radius:12px;padding:20px;text-align:center;color:#aaa}
.btn{width:100%;border:0;border-radius:12px;padding:16px;margin-top:22px;background:#e10600;color:#fff;font-size:17px;font-weight:800}
.note{font-size:12px;color:#777;text-align:center;margin-top:14px}
footer{text-align:center;color:#666;padding:20px}
</style>
</head>
<body>
<main class="app">
<header><div class="logo"><span>V</span>NO</div><div class="sub">REFORMAS MULTISERVICIOS</div></header>
<section class="screen">
<button class="back" onclick="location.reload()">← Volver</button>
<h1>Solicitar presupuesto</h1>
<p class="intro">Cuéntanos qué necesitas y nos pondremos en contacto contigo.</p>

<label>Tipo de trabajo</label>
<div class="options">
<button class="option" onclick="sel(this)">🔧 Fontanería</button>
<button class="option" onclick="sel(this)">🧱 Albañilería</button>
<button class="option" onclick="sel(this)">🎨 Pintura</button>
<button class="option" onclick="sel(this)">⚡ Electricidad</button>
<button class="option" onclick="sel(this)">🏠 Reforma</button>
<button class="option" onclick="sel(this)">🔨 Otro</button>
</div>

<label>Describe el trabajo</label>
<textarea placeholder="Explícanos brevemente qué necesitas..."></textarea>

<label>Fotos del trabajo</label>
<div class="photo">📸 Pulsa aquí para añadir fotos</div>

<label>Nombre</label>
<input placeholder="Tu nombre">

<label>Teléfono</label>
<input type="tel" placeholder="Tu teléfono">

<label>Dirección</label>
<input placeholder="Dirección del trabajo">

<button class="btn" onclick="enviar()">ENVIAR SOLICITUD</button>
<div class="note">En el siguiente paso conectaremos este botón para que la solicitud nos llegue de verdad.</div>
</section>
<footer>VNO Reformas Multiservicios</footer>
</main>
<script>
function sel(el){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function enviar(){alert('¡Perfecto! La solicitud está preparada. Ahora conectaremos el envío para que llegue a VNO.')}
</script>
</body>
</html>
